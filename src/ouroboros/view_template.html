<!doctype html>
<html lang="en" data-theme="light">
<head>
<script>if(!/\/$|\.[a-z]+$/i.test(location.pathname))location.replace(location.pathname+'/'+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<link rel="icon" href="{{favicon}}">
<script>try{var t=localStorage.getItem("ouroboros-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
:root{--paper:#fbfaf6;--ink:#1d1d1b;--mute:#6d6a63;--rule:#d6d1c4;--faint:#ece8dd;--acc:#1f77b4;--acc-bg:#dee7f1;
--ok:#2ca02c;--ok-bg:#d5f0cd;--warn:#ff7f0e;--warn-bg:#fde2c6;--bad:#d62728;--bad-bg:#fdd5d2;
--ok-t:#238323;--warn-t:#b1580c;--bad-t:#d62728;--blocked:#e377c2;
--actor:#08519c;--critic:#4292c6;--scribe:#9ecae1;--code:#f1eee6;
--g-met:#08519c;--g-open:#9ecae1;--g-broken:#d62728;--g-blocked:#9467bd;--rec:linear-gradient(90deg,#4292c6,#7bb1d8,#b3d1e9);
--serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
--sans:"Avenir Next","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme="dark"]{color-scheme:dark;--paper:#17181a;--ink:#e7e4dc;--mute:#9b978e;--rule:#3a3a37;--faint:#26272a;--acc:#679fce;--acc-bg:#192d3c;
--ok:#62c05b;--ok-bg:#1c361e;--warn:#ff9d43;--warn-bg:#4a2f17;--bad:#eb605f;--bad-bg:#411b1d;
--ok-t:#62c05b;--warn-t:#ff9d43;--bad-t:#eb605f;--blocked:#ed97ca;
--actor:#c6dbef;--critic:#6baed6;--scribe:#2171b5;--code:#222326;
--g-met:#c6dbef;--g-open:#2171b5;--g-broken:#ff9896;--g-blocked:#c5b0d5;--rec:linear-gradient(90deg,#6baed6,#497ca1,#274b6c)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--serif);overflow-wrap:anywhere}
main{max-width:1040px;margin:0 auto;padding:18px 40px 56px}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font:.84em var(--mono);background:var(--code);padding:.05em .3em;border-radius:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.quiet,.sub{color:var(--mute)}
.sub{display:block;font-size:.88rem;margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;
padding:0 0 12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;color:var(--ink);flex:none}
.kick,.stamp,.lab,dt,th,.chip,.legend{font-family:var(--sans)}
.kick{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.stamp{font-size:.82rem;color:var(--mute);display:flex;align-items:center;gap:8px}
.stamp .run{color:var(--ink);font-weight:600}
.ago.warn{color:var(--warn);font-weight:600}
.theme{font:inherit;background:none;border:1px solid var(--rule);color:var(--mute);border-radius:2px;padding:0 6px;cursor:pointer}
h1{font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1.12;font-weight:600;letter-spacing:-.012em;margin:22px 0 12px}
.meta{margin:0 0 14px;color:var(--mute);font:.82rem var(--sans)}
.notice{margin:0 0 12px;padding:6px 10px;border-left:3px solid var(--mute);background:var(--faint);font:.9rem var(--sans)}
.notice.warn{border-color:var(--warn)}
.lede{margin:0 0 6px}
.lede p{font-size:1.16rem;line-height:1.55;margin:0 0 .6em}
.src{font:.8rem var(--sans);color:var(--mute);margin:.2em 0 0}

/* the loop and the key figures */
.hero{display:grid;gap:8px 40px;grid-template-columns:1fr;margin:18px 0 8px;padding:4px 0 0;border-top:1px solid var(--rule)}
@media (min-width:860px){.hero{grid-template-columns:minmax(340px,420px) 1fr;align-items:start}.hero .side{padding-top:22px}.hero .ring{max-width:400px;margin-left:-36px}}
.loopfig{margin:0;text-align:center}
.ring{width:100%;max-width:470px;height:auto;display:block;margin:0 auto}
figcaption,.cap{font:.82rem/1.45 var(--sans);color:var(--mute);margin-top:6px;text-align:left}
figcaption b{color:var(--ink);font-weight:600}
.ring .track{fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-dasharray:0 7;opacity:.6}
.ring .ca{fill:var(--mute)}
.ring .bg{fill:var(--acc);font-weight:600}
.ring .nl{font:600 19px var(--serif);fill:var(--ink)}
.ring .ns{font:12.5px var(--sans);fill:var(--mute)}
.ring .cl{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;fill:var(--mute)}
.ring .cn{font:600 50px var(--serif);fill:var(--ink)}
.ring .cs{font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;fill:var(--acc)}
.ring .ct{font:14px var(--mono);fill:var(--mute)}
.dial .seg{fill:none;stroke-linecap:butt}
.dial .seg.work{stroke:var(--actor)}.dial .seg.critique{stroke:var(--critic)}.dial .seg.scribe{stroke:var(--scribe)}
.dial .seg.past{opacity:.45}
.dial .nl{font-size:16px;fill:var(--mute)}.dial .nl.on{fill:var(--ink)}
.dial .hand{stroke:var(--acc);stroke-width:1.6}
.dial .head{fill:var(--acc);stroke:var(--paper);stroke-width:1.5}
.dial .vt{stroke-width:2}.dial .vt.ok{stroke:var(--ok)}.dial .vt.warn{stroke:var(--warn)}.dial .vt.bad{stroke:var(--bad)}
.dial .mk{stroke:var(--mute);stroke-width:1.5}

.figs{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:14px 16px;margin:0 0 18px}
.fig{padding:0}
.fig dt,.fig .num{white-space:nowrap}
.fig dd:has(.chip){display:flex;align-items:center;height:1.1em}
dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.fig dd{margin:2px 0 0;font-size:1.9rem;line-height:1.1;font-weight:600}
.fig dd small{display:block;font:.78rem var(--sans);color:var(--bad);font-weight:400;margin-top:2px}
.fig .of{color:var(--mute);font-weight:400;font-size:.6em}
.fig .chip{font-size:.8rem;vertical-align:middle}
.lab{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 6px}

/* time and usage: a row of square cells, lit green to red */
.gauge{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:0 12px;padding:4px 0;font-family:var(--sans)}
.gl{font-size:.86rem;font-weight:600}
.gl small{display:block;font-weight:400;color:var(--mute);font-size:.76rem}
.ico{width:15px;height:15px;margin-right:6px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}.ico .pin{fill:currentColor;stroke:none}
.cells{display:flex;gap:3px}
.cells i{flex:1;max-width:18px;aspect-ratio:1;background:var(--faint);border-radius:4px}
.cells i.on:nth-child(1){background:#1a9850}.cells i.on:nth-child(2){background:#2ea255}.cells i.on:nth-child(3){background:#42ab5a}.cells i.on:nth-child(4){background:#56b55f}.cells i.on:nth-child(5){background:#69be63}.cells i.on:nth-child(6){background:#7ac665}.cells i.on:nth-child(7){background:#8bcd67}.cells i.on:nth-child(8){background:#9cd569}.cells i.on:nth-child(9){background:#afd469}.cells i.on:nth-child(10){background:#c6c967}.cells i.on:nth-child(11){background:#ddbe64}.cells i.on:nth-child(12){background:#f4b362}.cells i.on:nth-child(13){background:#fca45c}.cells i.on:nth-child(14){background:#f99354}.cells i.on:nth-child(15){background:#f7824c}.cells i.on:nth-child(16){background:#f47045}.cells i.on:nth-child(17){background:#ee603d}.cells i.on:nth-child(18){background:#e65036}.cells i.on:nth-child(19){background:#df402e}.cells i.on:nth-child(20){background:#d73027}

.gv{font-size:1.15rem;font-weight:600;min-width:3.2em;text-align:right}
.gv small{font-size:.7em;color:var(--mute)}
.gv.wide{grid-column:2/-1;text-align:left}
.gs{grid-column:2/-1;font-size:.74rem;color:var(--mute);margin-top:-4px}
.agent{margin:0 0 10px}
.who{margin:4px 0 2px;font:.86rem var(--sans)}
.who code{font-size:.8rem}.who .quiet{font-size:.76rem}
.agent .gl{font-weight:400;color:var(--mute)}
.tbar{display:flex;height:8px;background:var(--faint);overflow:hidden;border-radius:1px}
.tbar span{display:block;height:100%}
.t-input{background:var(--actor)}.t-cache_read{background:var(--rule)}.t-cache_write{background:var(--critic)}.t-output{background:var(--ok)}
.tok .legend{gap:2px 10px;font-size:.72rem}.tok .legend i{width:8px;height:8px}

/* right now: the one highlighted block */
.now{margin:22px 0 0;padding:12px 16px 12px 14px;background:var(--acc-bg);border-left:3px solid var(--acc)}
.now p{margin:0}
.now-k{font:600 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px}
.now-k .live{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.6s ease-in-out infinite}
.now-t{font-size:1.2rem;line-height:1.45;margin-top:4px!important}
.now-a{font:.9rem/1.45 var(--sans);margin-top:6px!important}.now-a code{font-size:.82rem}.now-a .act-for{color:var(--mute)}
.now-s{font:.86rem/1.45 var(--sans);color:var(--mute);margin-top:4px!important}
@keyframes blink{50%{opacity:.25}}

/* sections: numbered, ruled, not boxed */
main{counter-reset:sec}
.sec{margin:34px 0 0;min-width:0}
.sec>h2{counter-increment:sec;font-size:1.45rem;font-weight:600;margin:0 0 12px;padding-top:10px;border-top:1px solid var(--rule)}
.sec>h2::before{content:counter(sec);font:600 .8rem var(--sans);color:var(--acc);margin-right:.7em;vertical-align:.25em}
.two{display:grid;gap:0 40px;grid-template-columns:1fr}
@media (min-width:860px){.two{grid-template-columns:1.25fr 1fr}}

.chip{display:inline-block;padding:0 6px;border:1px solid currentColor;border-radius:2px;font-size:.7rem;font-weight:600;
letter-spacing:.06em;text-transform:uppercase;line-height:1.6;white-space:nowrap;color:var(--mute);text-decoration:none;vertical-align:.1em}
.chip.ok{color:var(--ok-t);background:var(--ok-bg)}.chip.warn{color:var(--warn-t);background:var(--warn-bg)}
.chip.bad{color:var(--bad-t);background:var(--bad-bg)}.chip.on{color:var(--acc);background:var(--acc-bg)}.chip.mute{color:var(--mute)}
.chip.ok,.chip.warn,.chip.bad,.chip.on{border-color:transparent}
.ok{color:var(--ok-t)}.warn{color:var(--warn-t)}.bad{color:var(--bad-t)}

.meter{margin:0 0 6px;font-family:var(--sans);font-size:.9rem}
.meter .num{font-weight:700;font-size:1rem}
.bar{height:6px;background:var(--faint);margin:0 0 6px}
.bar span{display:block;height:100%;background:var(--ok)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
.rows li:last-child,.story tbody tr:last-child td{border-bottom:0}
.rows .chip{flex:none;min-width:5.6em;text-align:center}
.more-rows{border-top:1px solid var(--rule)}
.more-rows>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 0;color:var(--acc);font:600 .8rem var(--sans);letter-spacing:.04em}
.more-rows>summary::-webkit-details-marker{display:none}
.more-rows>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.more-rows[open]>summary::before{transform:rotate(45deg) translate(-2px,-2px)}
.more-rows .opened,.more-rows[open] .closed{display:none}
.more-rows[open] .opened{display:inline}
.more-rows[open]>summary{order:2}
.more-rows[open]{display:flex;flex-direction:column}
.more-rows>.rows li:first-child{border-top:0}
.what em{font-style:italic}.what a{text-decoration-thickness:1px}
.what{flex:1;min-width:0}
.count{flex:none;color:var(--mute);font:.78rem var(--sans)}
.gone{opacity:.55}

/* the story: the scribe's, full width */
.story>h2+*{margin-top:0}
.story h2:not(:first-child){font-size:1.25rem;margin:1.6em 0 .4em}
.story>h2:first-child{margin-bottom:12px}
.story section>h2,.story>h3,.story section>h3{font-size:1.22rem;font-weight:600;margin:1.4em 0 .35em}
.story section:first-of-type>h2:first-child,.story section:first-of-type>h3:first-child{margin-top:.2em}
.story figure{margin:0 0 14px}
.story img,.story video{max-width:100%;height:auto}
.story svg{width:100%;height:auto;max-height:520px;color:var(--acc)}
.story table{border-collapse:collapse;width:100%;font:.9rem var(--sans)}
.story th,.story td{border-bottom:1px solid var(--rule);padding:6px 10px 6px 0;text-align:left;vertical-align:top}
.story thead th{border-bottom:1px solid var(--rule)}
.story pre{background:var(--code);padding:10px;overflow-x:auto;font-size:.85rem}
.story pre code{background:none;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px 32px;align-items:start}
.story td.num,.story th.num,.num.r{text-align:right}

/* the timeline */
figure.wide{margin:0 0 10px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--faint)}.chart .base{stroke:var(--ink)}
.chart .ax{font:11px var(--sans);fill:var(--mute)}
.chart .s-actor,.legend .s-actor{fill:var(--actor);background:var(--actor)}
.chart .s-critic,.legend .s-critic{fill:var(--critic);background:var(--critic)}
.chart .s-scribe,.legend .s-scribe{fill:var(--scribe);background:var(--scribe)}
.chart .s-run{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 3;animation:march 1s linear infinite}
.chart .v.ok,.legend .v.ok{fill:var(--ok);background:var(--ok)}
.chart .v.warn,.legend .v.warn{fill:var(--warn);background:var(--warn)}
.chart .v.bad,.legend .v.bad{fill:var(--bad);background:var(--bad)}
.chart .v.mute,.chart .v.on{fill:var(--rule)}
.chart .x{stroke:var(--paper);stroke-width:1.6}
.chart .fold{fill:var(--acc)}
.legend .fold{background:var(--acc);transform:rotate(45deg) scale(.8)}
.chart .col:hover rect{opacity:.75}
@keyframes march{to{stroke-dashoffset:-6}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:.78rem}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
/* a finding and an iteration fold the same way: a chevron, the summary, the rest under it */
.finding>summary,.it>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.finding>summary::-webkit-details-marker,.it>summary::-webkit-details-marker{display:none}
.finding>summary::before,.it>summary::before{content:"";flex:none;width:7px;height:7px;border-right:1.5px solid var(--acc);border-bottom:1.5px solid var(--acc);transform:rotate(-45deg) translateY(-2px);transition:transform .15s}
.finding[open]>summary::before,.it[open]>summary::before{transform:rotate(45deg) translate(-3px,-1px)}
.finding{border-bottom:1px solid var(--rule);padding:4px 0 6px}
.finding:last-child,.story>section:last-child .finding{border-bottom:0}
.finding>summary>h2,.finding>summary>h3{font-size:1.22rem;font-weight:600;margin:.35em 0}
.finding[open]>summary{margin-bottom:.35em}
ul.its{list-style:none;margin:0;padding:0;font:.88rem/1.45 var(--sans)}
ul.its>li{border-bottom:1px solid var(--rule)}
ul.its>li:last-child{border-bottom:0}
.it>summary{padding:8px 0}
.it .n{flex:none;min-width:1.6em;font-weight:600}
.it .chip{flex:none}
.it .what .chip{margin-left:4px}
.it .took{flex:none;color:var(--mute)}
.it:target{background:var(--acc-bg)}
.it dl.more{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px;padding-left:calc(17px + 1.6em)}
.it dl.more dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding-top:.2em}
.it dl.more dd{margin:0}
details.older>summary{cursor:pointer;color:var(--acc);font:.88rem var(--sans);padding:8px 0}
.graphfig{margin:0 calc(50% - min(600px, 50vw - 16px))}  /* wider than the text column, up to 1200px */
iframe.graph{display:block;width:100%;height:min(720px,85vh);border:0;background:var(--paper)}
.graphfig figcaption{text-align:center}
.graphfig .legend{margin-top:6px;justify-content:center}
/* the graph's tools, under its legend */
.graph-tools{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:8px;margin:10px 0 4px;font:.8rem var(--sans)}
.graph-tools[hidden]{display:none}
.graph-tools button,.graph-tools summary{font:inherit;background:var(--faint);color:var(--ink);border:0;border-radius:5px;padding:5px 11px;cursor:pointer}
.graph-tools button:hover,.graph-tools summary:hover,.graph-tools button[aria-pressed="true"]{background:var(--rule)}
.graph-tools details{max-width:min(520px,100%)}.graph-tools summary{width:fit-content}
.graph-tools details ul{margin:8px 0 0;padding:8px 12px 8px 28px;max-height:260px;overflow:auto;border:1px solid var(--rule);border-radius:5px;text-align:left;color:var(--mute)}
.legend .g-working{background:var(--g-met);border-radius:50%}.legend .g-open{background:var(--g-open);border-radius:50%}
.legend .g-broken{background:var(--g-broken);border-radius:50%}.legend .g-blocked{background:var(--g-blocked);border-radius:50%}
.legend .g-record{background:var(--rec);border-radius:50%;transform:scale(.7)}
footer{margin-top:40px;padding-top:8px;border-top:1px solid var(--rule);color:var(--mute);font:.76rem var(--sans)}
@media (max-width:640px){main{padding:18px 16px 56px}body{font-size:16px}.logo{width:44px;height:44px}.kick{font-size:.82rem}iframe.graph{height:480px}.figs{grid-template-columns:repeat(3,minmax(0,1fr))}.lede p{font-size:1.05rem}.it dl.more{grid-template-columns:1fr;padding-left:0}.it dl.more dd{margin-bottom:6px}
.gauge{grid-template-columns:1fr auto}.cells,.tbar{grid-column:1/-1;order:3}.gs{grid-column:1/-1;order:4;margin-top:2px}.fig dd{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view" data-version="{{version}}">
{{header}}
{{summary}}
<div class="hero">
<figure class="loopfig">{{loop}}</figure>
<div class="side">{{figures}}{{time_budget}}{{usage}}{{done}}</div>
</div>
<section class="now" aria-live="polite" aria-label="Right now">{{now}}</section>
<div class="two">
<section class="sec" aria-labelledby="h-criteria"><h2 id="h-criteria">Progress toward done</h2>{{criteria}}</section>
<section class="sec" aria-labelledby="h-frontier"><h2 id="h-frontier">Open problems</h2>{{frontier}}</section>
</div>
<section class="sec" id="graph-sec" data-v="{{graph_version}}" aria-labelledby="h-graph"><h2 id="h-graph">Memory graph</h2>{{graph}}</section>
<section class="sec story" aria-labelledby="h-story"><h2 id="h-story">Findings</h2>{{story}}</section>
<section class="sec" aria-labelledby="h-progress"><h2 id="h-progress">Timeline</h2>{{progress}}</section>
<footer>{{generated}}</footer>
</main>
<script>
(function () {
  var view = document.getElementById("view");
  // a link to a folded row (the chart's columns) opens it, and whatever folds it in
  function reveal() {
    var t = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    for (; t; t = t.parentElement) if (t.tagName === "DETAILS") t.open = true;
  }
  window.addEventListener("hashchange", reveal);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (a && a.getAttribute("href") === location.hash) reveal();   // the same link twice fires no hashchange
  });
  reveal();
  function fmt(s) {
    if (s >= 172800) return Math.floor(s / 86400) + " d " + Math.floor(s % 86400 / 3600) + " h";
    if (s < 60) return s + " s";
    if (s < 3600) return Math.floor(s / 60) + " min";
    var m = Math.floor(s % 3600 / 60);
    return Math.floor(s / 3600) + " h " + (m < 10 ? "0" : "") + m + " min";
  }
  function clock(s) {
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function span(s) {   // as view.py's _span: '45 s', '4 min', '1 h 05'
    if (s < 60) return s + " s";
    if (s < 3600) return Math.floor(s / 60) + " min";
    var m = Math.floor(s % 3600 / 60);
    return Math.floor(s / 3600) + " h " + (m < 10 ? "0" : "") + m;
  }
  function tick() {
    var now = Date.now() / 1000;
    var el = document.getElementById("ago");
    var ts = el && +el.getAttribute("data-ts");
    if (ts) {
      var s = Math.max(0, Math.round(now - ts));
      var stale = el.getAttribute("data-live") === "1" && s > 120;
      el.textContent = "updated " + fmt(s) + " ago" + (stale ? " (stale)" : "");
      el.classList.toggle("warn", stale);
    }
    dial();
    document.querySelectorAll(".act-for[data-since]").forEach(function (a) {
      a.textContent = "for " + clock(Math.max(0, Math.round(now - +a.getAttribute("data-since"))));
    });
    document.querySelectorAll(".clock[data-start]").forEach(function (g) {
      var used = Math.max(0, Math.round(now - +g.getAttribute("data-start")));
      var budget = +g.getAttribute("data-budget") || 0;
      var put = function (sel, text) { var x = g.querySelector(sel); if (x) x.textContent = text; };
      put(".el", span(used));
      if (!budget) return;
      put(".left", span(Math.max(0, budget - used)));
      put(".pc", Math.min(100, Math.round(100 * used / budget)));
      var cells = g.querySelectorAll(".cells i"), lit = Math.round(Math.min(1, used / budget) * cells.length);
      cells.forEach(function (c, k) { c.className = k < lit ? "on" : ""; });
    });
    document.querySelectorAll(".reset[data-at]").forEach(function (r) {
      var left = Math.round(+r.getAttribute("data-at") - now);
      r.textContent = left > 0 ? "in " + fmt(left) : "now";
    });
  }
  function graph() {
    var f = document.querySelector("iframe.graph[data-src]");
    if (!f) return;
    var want = f.getAttribute("data-src") + (document.documentElement.getAttribute("data-theme") === "dark" ? "&theme=dark" : "");
    if (f.getAttribute("src") !== want) f.setAttribute("src", want);
  }
  // The graph's tools sit under its legend and work the embed through the keys it answers to (F fits,
  // N names); the titles come from its snapshot. Shown only once the page can reach into the frame.
  function graphTools() {
    var f = document.querySelector("iframe.graph"), tools = document.querySelector(".graph-tools");
    if (!f || !tools) return;
    var names = tools.querySelector('[data-key="n"]');
    try {
      var nodes = JSON.parse(f.contentDocument.getElementById("flywheel-snapshot").textContent).nodes;
      tools.querySelector("summary").textContent = "Node titles (" + nodes.length + ")";
      tools.querySelector("ul").innerHTML = nodes.map(function (n) {
        return "<li>" + String(n.title).replace(/[&<>]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]; }) + "</li>";
      }).join("");
      tools.hidden = false;
    } catch (e) { tools.hidden = true; return; }
    names.setAttribute("aria-pressed", "false");
    names.textContent = "Show names";
  }
  document.addEventListener("load", function (e) { if (e.target.matches && e.target.matches("iframe.graph")) graphTools(); }, true);
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".graph-tools button[data-key]"), f = document.querySelector("iframe.graph");
    if (!b || !f) return;
    try { var w = f.contentWindow; w.dispatchEvent(new w.KeyboardEvent("keydown", {key: b.getAttribute("data-key")})); } catch (err) { return; }
    if (b.getAttribute("data-key") === "n") {
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on);
      b.textContent = on ? "Hide names" : "Show names";
    }
  });
  // Fig. 1, the dial, drawn from what view.py puts on the svg (data-dial) and again every second.
  // One turn is the smallest round span that holds this iteration and the three before it; the
  // band fills from twelve o'clock by stage, the hand is now, the tick the critic's verdict, and
  // the thin inner rings are the iterations before, on the same clock.
  var KEYS = ["work", "critique", "scribe"], NAMES = {work: "actor", critique: "critic", scribe: "scribe"};
  var TURNS = [300, 600, 900, 1800, 3600, 7200, 14400, 28800, 57600];
  var CX = 150, CY = 150, R = 108, BAND = 22, PAST = [86, 75, 64];
  function f1(x) { return x.toFixed(1); }
  function pt(r, a) { var t = a * Math.PI / 180; return [CX + r * Math.cos(t), CY + r * Math.sin(t)]; }
  function arc(r, a0, a1) {   // clockwise round the centre from a0 to a1, in degrees
    var p = pt(r, a0), q = pt(r, a1);
    return "M" + f1(p[0]) + "," + f1(p[1]) + " A" + r + "," + r + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + f1(q[0]) + "," + f1(q[1]);
  }
  function seg(out, key, a0, a1, r, w, cls) {
    if (a1 - a0 > 0.3) out.push('<path class="seg ' + key + (cls || "") + '" d="' + arc(r, a0, Math.min(a1, a0 + 359.9)) + '" stroke-width="' + w + '"/>');
  }
  function label(a, name, sub, on) {   // a stage's name outside the dial, anchored by where it sits
    var t = a * Math.PI / 180, c = Math.cos(t), s = Math.sin(t), p = pt(R + BAND / 2 + 14, a);
    var anchor = c > 0.35 ? "start" : c < -0.35 ? "end" : "middle", y = s < -0.6 ? p[1] - 20 : s > 0.6 ? p[1] + 12 : p[1] - 2;
    return '<text class="nl' + (on ? " on" : "") + '" x="' + f1(p[0]) + '" y="' + f1(y) + '" text-anchor="' + anchor + '">' + name + '</text>' +
      '<text class="ns" x="' + f1(p[0]) + '" y="' + f1(y + 16) + '" text-anchor="' + anchor + '">' + sub + '</text>';
  }
  function dial() {
    var svg = document.querySelector("svg.dial[data-dial]");
    if (!svg) return;
    var d;
    try { d = JSON.parse(svg.getAttribute("data-dial")); } catch (e) { return; }
    var now = d.live || !d.at ? Date.now() / 1000 : d.at;
    var t = d.start != null ? Math.max(0, now - d.start) : 0;
    var need = t, out = ['<circle class="track" cx="' + CX + '" cy="' + CY + '" r="' + R + '"/>'];
    d.past.forEach(function (p) { need = Math.max(need, p[0] + p[1] + p[2]); });
    var turn = TURNS[TURNS.length - 1];
    for (var k = 0; k < TURNS.length; k++) if (TURNS[k] >= need * 1.1) { turn = TURNS[k]; break; }
    function A(s) { return -90 + 360 * s / turn; }
    for (var m = 0; m < 3; m++) {   // a mark every third of a turn
      var p0 = pt(R + BAND / 2 + 2, A(m * turn / 3)), p1 = pt(R + BAND / 2 + 7, A(m * turn / 3));
      out.push('<line class="mk" x1="' + f1(p0[0]) + '" y1="' + f1(p0[1]) + '" x2="' + f1(p1[0]) + '" y2="' + f1(p1[1]) + '"/>');
    }
    d.past.forEach(function (p, i) {
      var s = 0;
      KEYS.forEach(function (key, j) { seg(out, key, A(s), A(s + p[j]), PAST[i], 9, " past"); s += p[j]; });
    });
    var prev = -Infinity, running = null;
    d.stages.forEach(function (st) {
      var s0 = st[1] - d.start, s1 = (st[2] != null ? st[2] : now) - d.start;
      if (st[2] == null) running = st[0];
      seg(out, st[0], A(s0), A(s1), R, BAND);
      var a = Math.max(A((s0 + s1) / 2), prev + 30);   // nudged apart where a stage is short
      prev = a;
      out.push(label(a, NAMES[st[0]], clock(Math.max(0, Math.round(s1 - s0))), st[2] == null));
    });
    var judged = d.stages.filter(function (st) { return st[0] === "critique" && st[2] != null; })[0];
    if (judged && d.verdict) {
      var v0 = pt(R - BAND / 2 - 1, A(judged[2] - d.start)), v1 = pt(R - BAND / 2 - 7, A(judged[2] - d.start));
      out.push('<line class="vt ' + d.verdict + '" x1="' + f1(v0[0]) + '" y1="' + f1(v0[1]) + '" x2="' + f1(v1[0]) + '" y2="' + f1(v1[1]) + '"/>');
    }
    if (d.start != null) {
      var h0 = pt(60, A(t)), h1 = pt(R + BAND / 2 + 4, A(t)), hh = pt(R, A(t));
      out.push('<line class="hand" x1="' + f1(h0[0]) + '" y1="' + f1(h0[1]) + '" x2="' + f1(h1[0]) + '" y2="' + f1(h1[1]) + '"/>' +
        '<circle class="head" cx="' + f1(hh[0]) + '" cy="' + f1(hh[1]) + '" r="4"/>');
    }
    var word = NAMES[d.state] || d.state || "–", act = d.kind === "command" ? "command" : d.kind === "wait" ? "waiting" : d.kind === "tool" ? "tool" : "";
    out.push('<text x="' + CX + '" y="' + (CY - 30) + '" text-anchor="middle" class="cl">iteration</text>' +
      '<text x="' + CX + '" y="' + (CY + 10) + '" text-anchor="middle" class="cn">' + (d.n != null ? d.n : "–") + '</text>' +
      '<text x="' + CX + '" y="' + (CY + 34) + '" text-anchor="middle" class="cs">' + word + (act ? '<tspan class="ca"> · ' + act + '</tspan>' : "") + '</text>' +
      (d.start != null ? '<text x="' + CX + '" y="' + (CY + 52) + '" text-anchor="middle" class="ct">' + clock(Math.round(t)) + '</text>' : "") +
      (d.shells ? '<text x="' + CX + '" y="' + (CY + 68) + '" text-anchor="middle" class="ns bg">' + d.shells + ' background shell' + (d.shells === 1 ? "" : "s") + '</text>' : ""));
    svg.innerHTML = out.join("");
  }
  function theme(next) {
    document.documentElement.setAttribute("data-theme", next || "light");
    try { localStorage.setItem("ouroboros-theme", next || "light"); } catch (e) {}
    graph();
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest(".theme");
    if (!b) return;
    theme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  tick();
  graph();
  setInterval(tick, 1000);
  if (!view || !window.fetch || location.protocol === "file:") return;
  var busy = false;
  function swap() {
    return fetch("index.html", {cache: "no-store"}).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
      if (!t) return;
      var doc = new DOMParser().parseFromString(t, "text/html");
      var next = doc.getElementById("view");
      if (!next) return;
      var open = {};
      view.querySelectorAll("details[id]").forEach(function (d) { open[d.id] = d.open; });
      var x = window.scrollX, y = window.scrollY;
      // the graph keeps its pan and zoom: its frame stays in place unless the memory changed
      var keep = document.getElementById("graph-sec"), fresh = next.querySelector("#graph-sec");
      if (keep && fresh && keep.parentNode === view && keep.getAttribute("data-v") === fresh.getAttribute("data-v")) {
        Array.prototype.slice.call(view.childNodes).forEach(function (c) { if (c !== keep) view.removeChild(c); });
        var before = true;
        Array.prototype.slice.call(next.childNodes).forEach(function (c) {
          if (c.id === "graph-sec") { before = false; return; }
          var n = document.importNode(c, true);
          if (before) view.insertBefore(n, keep); else view.appendChild(n);
        });
      } else view.innerHTML = next.innerHTML;
      graph();
      view.setAttribute("data-version", next.getAttribute("data-version") || "");
      view.querySelectorAll("details[id]").forEach(function (d) { if (d.id in open) d.open = open[d.id]; });
      if (doc.title) document.title = doc.title;
      window.scrollTo(x, y);
      tick();
    });
  }
  window.ouroborosSwap = swap;   // `ouroboros view --debug` swaps after each change
  function poll() {
    if (busy || document.hidden) return;
    busy = true;
    fetch("live.json", {cache: "no-store"}).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && j.version && j.version !== view.getAttribute("data-version")) return swap();
    }).catch(function () {}).then(function () { busy = false; });
  }
  setInterval(poll, 10000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
