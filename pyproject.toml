[project]
name = "ouroboros"
version = "0.1.0"
description = "A loop runner for agent harnesses. Never blocks, never stops early, always leaves memory."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ouroboros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
